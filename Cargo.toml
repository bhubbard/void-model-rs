[package]
name = "void-model"
version = "0.1.0"
edition = "2021"
authors = ["Brandon Hubbard <bhubbard@users.noreply.github.com>"]
description = "High-performance, pure Rust port of Netflix's VOID (Video Object and Interaction Deletion) — interaction-aware video inpainting, QuadMask reasoning, optical flow warped noise, and physical scene dynamics."
license = "Apache-2.0"
repository = "https://github.com/bhubbard/void-model-rs"
homepage = "https://github.com/bhubbard/void-model-rs"
keywords = ["video-inpainting", "object-removal", "diffusion", "optical-flow", "physics"]
categories = ["multimedia::video", "science", "command-line-utilities"]

[dependencies]
clap = { version = "4.5", features = ["derive", "cargo", "env"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
anyhow = "1.0"
thiserror = "1.0"
regex = "1.11"
rand = "0.8"
rand_distr = "0.4"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[dev-dependencies]
tempfile = "3.13"

[[bin]]
name = "void"
path = "src/main.rs"

[lib]
name = "void_model"
path = "src/lib.rs"
